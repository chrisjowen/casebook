apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: casebook:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'apps/web/build']
          envFrom:
            - configMapRef:
                name: casebook
            - secretRef:
                name: casebook-db
          env:
            - name: PORT
              value: '3000'
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /signin
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: files
              mountPath: /data/files
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: casebook-files
