$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'application'

# The app imports @casebook/model and @casebook/store, which resolve to their built output.
dependsOn:
  - 'model'
  - 'store'

tasks:
  dev:
    command: 'vite dev'
    preset: 'server'
    deps:
      - '^:build'
  build:
    command: 'vite build'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'static/**/*'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '/packages/model/fixtures/**/*'
    outputs:
      - 'build'
  check:
    script: 'svelte-kit sync && svelte-check --tsconfig ./tsconfig.json --fail-on-warnings'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - '/packages/model/fixtures/**/*'
      - 'tsconfig.json'
  lint:
    command: 'eslint .'
    inputs:
      - '**/*'
      - '/eslint.config.js'
  test:
    command: 'vitest run'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - '/packages/model/fixtures/**/*'
