$schema: '../../.moon/cache/schemas/project.json'

language: 'typescript'
layer: 'library'

tasks:
  build:
    command: 'tsc -p tsconfig.build.json'
    inputs:
      - 'src/**/*'
      - 'tsconfig.build.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  check:
    command: 'tsc -p tsconfig.json'
    inputs:
      - 'src/**/*'
      - 'drizzle.config.ts'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
  lint:
    command: 'eslint .'
    inputs:
      - '**/*'
      - '/eslint.config.js'
  test:
    command: 'vitest run --passWithNoTests'
    inputs:
      - 'src/**/*'
