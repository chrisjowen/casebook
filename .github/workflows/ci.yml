name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The store tests create a throwaway database on this server and migrate it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casebook
          POSTGRES_PASSWORD: casebook
          POSTGRES_DB: casebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casebook -d casebook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://casebook:casebook@127.0.0.1:5432/casebook
    steps:
      # moon's affected checks diff against the base branch, which needs full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs proto, then moon, Node and pnpm at the versions pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          proto-version: '0.63.2'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: moon run :check

      - name: Lint
        run: moon run :lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: moon run :test
